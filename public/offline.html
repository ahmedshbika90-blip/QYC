<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا يوجد اتصال — مسار</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f9fafb; font-family: system-ui, sans-serif; color:#1f2937; }
  .card { background:#fff; border-radius:12px; box-shadow:0 1px 3px rgba(0,0,0,.1);
          padding:28px 24px; max-width:340px; margin:16px; text-align:center; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { font-size:15px; color:#6b7280; line-height:1.6; margin:0 0 20px; }
  button { width:100%; height:48px; border:0; border-radius:8px; background:#111827;
           color:#fff; font-size:16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>هذه الصفحة لم تُفتح من قبل على هذا الجهاز، لذا لا يمكن عرضها بدون اتصال. الصفحات التي فتحتها سابقًا تعمل بدون إنترنت.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
